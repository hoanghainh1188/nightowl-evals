schema: spec-driven

context: |
  Source of truth: docs/nightowl-evals.md. When docs conflict with this file, fix this file.
  Package `@hoanghainh/nightowl-evals`, CLI `nightowl`. Stack: TypeScript, Node 22+, node:sqlite at `.nightowl/nightowl.db`, tsup, vitest, OpenSpec `spec-driven`, Apache-2.0, `npm publish --access public`.
  Write artifacts in Vietnamese; keep SHALL/MUST keywords and identifiers in English.
  Hard rules for every change:
  - No code or data leaves the machine; no telemetry or hidden network calls.
  - LLM features are off by default; the user opts in explicitly.
  - Hooks never block or slow the agent or git commit: always exit 0, log errors only.
  - `nightowl init` adds `.nightowl/` to the target project's .gitignore.
  - Grade AI, not people: never store or show developer names in reports.
  - Open-core only in this repo (CLI, hooks, SQLite, report/export). Team dashboard, advanced analytics, on-prem, and SaaS stay in private commercial repos.
  - Designs and tasks must cover macOS, Linux, and Windows unless a change explicitly scopes otherwise.
  Roadmap status: ideation 1–39 Done (release v0.5.1; Core 32–35 in v0.5.0, Secondary 36–39 in v0.5.1). Next: docs/v0.5-roadmap-ideas.md (closed; v0.6 ideation follows in a docs PR). See also docs/v0.3-roadmap-ideas.md and docs/v0.4-roadmap-ideas.md.

rules:
  proposal:
    - "State what is out of scope, especially anything that would leave the machine or add commercial/SaaS surfaces to this repo."
    - "Call out any hard-rule exception and require explicit approval."
  design:
    - "Prefer Node built-ins (node:sqlite, node:util parseArgs, node:fs) over new runtime dependencies."
    - "Keep hooks fail-open and non-blocking across supported agents and git managers."
  tasks:
    - "Prefer TDD: tests before implementation; target coverage >= 80% for changed code."
    - "Break work into small, verifiable steps (prefer chunks under ~2 hours)."
  specs:
    - "Keep requirement keywords as SHALL/MUST and identifiers in English; prose may be Vietnamese."

operations:
  apply:
    guidance:
      - "Follow conventional commits (feat:, fix:, refactor:, docs:, test:, chore:, perf:, ci:)."
      - "Keep files small and feature-oriented; prefer immutable data and functions under ~50 lines."
  archive:
    guidance:
      - "Update the matching roadmap doc status when archiving a numbered ideation item."
      - "Summarize the archive outcome before finishing."
