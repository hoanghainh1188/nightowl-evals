name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor in package.json engines; 24 is the current LTS.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Check published files
        run: npm pack --dry-run
      - run: npm run spec:validate
        if: matrix.node == '24'

  # Single stable check name for branch protection, independent of the matrix.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = success
